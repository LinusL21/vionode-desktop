<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vionode</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f9fafb; color: #111827;
           font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0 0 20px; color: #6b7280; }
    button { border: 0; border-radius: 8px; padding: 10px 18px; background: #111827; color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>Vionode will reconnect as soon as your internet is back.</p>
    <button id="retry">Try again</button>
  </div>
  <script>
    const url = new URLSearchParams(location.search).get('url');
    const retry = () => { location.href = url; };
    document.getElementById('retry').onclick = retry;
    window.addEventListener('online', retry);
  </script>
</body>
</html>
